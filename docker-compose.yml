services:
  task-results-init:
    image: alpine:3.24
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/.octopus
        chown -R 65532:65532 /app/.octopus
    volumes:
      - task-results:/app/.octopus
    restart: "no"

  octopus-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    image: octopus-scraper:latest
    container_name: octopus-service
    ports:
      - "8001:${SERVICE_PORT:-8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_CONTENT_DATABASE_ID=${NOTION_CONTENT_DATABASE_ID}
      - NOTION_SYNC_ENABLED=${NOTION_SYNC_ENABLED:-false}
      - NOTION_SYNC_INTERVAL_SECONDS=${NOTION_SYNC_INTERVAL_SECONDS:-60}
      - NOTION_SYNC_BATCH_SIZE=${NOTION_SYNC_BATCH_SIZE:-100}
      - NOTION_SYNC_MAX_ATTEMPTS=${NOTION_SYNC_MAX_ATTEMPTS:-10}
      - NOTION_SYNC_LEASE_SECONDS=${NOTION_SYNC_LEASE_SECONDS:-300}
      - NOTION_UPLOAD_RETRY_DELAY=${NOTION_UPLOAD_RETRY_DELAY:-30}
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_API_TOKEN=${MCP_API_TOKEN:-}
      - POSTGRES_DB=${POSTGRES_DB:-octopus}
      - POSTGRES_USER=${POSTGRES_USER:-octopus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-octopus}
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-10}
      - SCRAPER_CONFIG_DIR=/etc/octopus-scraper/scrapers.d
      - SCRAPER_CONFIG_POLL_INTERVAL=${SCRAPER_CONFIG_POLL_INTERVAL:-1}
      - SCRAPER_CONFIG_DEBOUNCE_SECONDS=${SCRAPER_CONFIG_DEBOUNCE_SECONDS:-0.75}
      # Cache config, will affect content refresh
      - OCTOPUS_DEBUG=${OCTOPUS_DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_FILE=${LOG_FILE:-}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      - TASK_MANAGER_MAX_CONCURRENT=${TASK_MANAGER_MAX_CONCURRENT:-3}
      - TASK_MANAGER_MAX_QUEUE_SIZE=${TASK_MANAGER_MAX_QUEUE_SIZE:-1000}
      - RESULT_RETENTION_HOURS=${RESULT_RETENTION_HOURS:-48}
      - OCTOPUS_TASK_RESULT_PATH=/app/.octopus/task_results.sqlite3
      - SCRAPER_TIMEOUT=${SCRAPER_TIMEOUT:-10}
      - UPLOAD_TIMEOUT=${UPLOAD_TIMEOUT:-15}
      - UPLOAD_MAX_RETRIES=${UPLOAD_MAX_RETRIES:-3}
      - OCTOPUS_SUMMARY_MAX_LENGTH=${OCTOPUS_SUMMARY_MAX_LENGTH:-500}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-3.5-turbo}
      - SERVICE_HOST=${SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${SERVICE_PORT:-8000}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # RSSHub fetcher HTTP timeouts in seconds. Defaults match the
      # historical hard-coded values; override via .env to tune.
      - RSSHUB_CONNECT_TIMEOUT=${RSSHUB_CONNECT_TIMEOUT:-10}
      - RSSHUB_READ_TIMEOUT=${RSSHUB_READ_TIMEOUT:-1200}

    healthcheck:
      test:
        [
          "CMD",
          "/app/octopus_service",
          "healthcheck",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

    restart: unless-stopped

    depends_on:
      task-results-init:
        condition: service_completed_successfully

    volumes:
      - ./resources/scrapers.d:/etc/octopus-scraper/scrapers.d:ro
      - task-results:/app/.octopus
      - octopus-logs:/app/logs

    networks:
      - octopus-network

  # 定时调度服务：基于 cron，编辑 scheduler/crontab 即可管理所有定时任务
  scheduler:
    image: alpine:3.24
    container_name: octopus-scheduler
    restart: unless-stopped
    depends_on:
      octopus-service:
        condition: service_healthy
    environment:
      - SERVICE_PORT=${SERVICE_PORT:-8000}
    volumes:
      - ./scheduler/crontab:/etc/scheduler/crontab:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        apk add --no-cache curl > /dev/null 2>&1
        case "$$SERVICE_PORT" in
          ''|*[!0-9]*) echo "Invalid SERVICE_PORT: $$SERVICE_PORT" >&2; exit 1 ;;
        esac
        sed "s/__SERVICE_PORT__/$$SERVICE_PORT/g" \
          /etc/scheduler/crontab > /var/spool/cron/crontabs/root
        chmod 600 /var/spool/cron/crontabs/root
        echo "Scheduler started with cron jobs:"
        cat /var/spool/cron/crontabs/root
        crond -f -l 2
    networks:
      - octopus-network

  rsshub:
    # if used default rsshub use image below
    # image: diygod/rsshub:chromium-bundled
    image: info-channel:1.0.0
    restart: always
    ports:
      - "1200:1200"
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://redis:6379/"
      XUEQIU_TOKEN: ${XUEQIU_TOKEN}
      XUEQIU_RATE_WINDOW_SECONDS: ${XUEQIU_RATE_WINDOW_SECONDS:-60}
      XUEQIU_RATE_LIMIT: ${XUEQIU_RATE_LIMIT:-25}
      XUEQIU_DELAY_MIN_MS: ${XUEQIU_DELAY_MIN_MS:-500}
      XUEQIU_DELAY_MAX_MS: ${XUEQIU_DELAY_MAX_MS:-1500}
      XUEQIU_SCAN_POST_REPLIES: ${XUEQIU_SCAN_POST_REPLIES:-true}
      CACHE_CONTENT_EXPIRE: ${CACHE_CONTENT_EXPIRE:-43200}
      CACHE_EXPIRE: ${CACHE_EXPIRE:-300}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - octopus-network

  redis:
    image: redis:alpine
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.25"
    networks:
      - octopus-network

  # Vector 日志监控服务：
  #   - 监控 rsshub 的 error 级别日志
  #   - 监控 octopus-service 的 "Task failed" 事件（task_manager 任务失败时发出）
  #   命中即通过飞书 Webhook 推送告警卡片。
  vector-alert:
    image: timberio/vector:latest-alpine
    container_name: vector-alert
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL}
      - VECTOR_LOG=${VECTOR_LOG:-info}
      # Vector 0.57+ requires an explicit opt-in for ${...} interpolation.
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.25"
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - octopus-network
    command: ["--config", "/etc/vector/vector.toml"]
    restart: unless-stopped
    depends_on:
      - rsshub
      - octopus-service

networks:
  octopus-network:
    driver: bridge

volumes:
  redis-data:
  task-results:
  octopus-logs:
