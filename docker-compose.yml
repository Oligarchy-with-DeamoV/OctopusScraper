version: "3.8"

services:
  octopus-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    image: octopus-scraper:latest
    container_name: octopus-service
    ports:
      - "8000:8000"
    environment:
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_SCRAPERS_DATABASE_ID=${NOTION_SCRAPERS_DATABASE_ID}
      - NOTION_CONTENT_DATABASE_ID=${NOTION_CONTENT_DATABASE_ID}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CONFIG_REFRESH_INTERVAL=${CONFIG_REFRESH_INTERVAL:-300}
      - USE_TASK_MANAGER=${USE_TASK_MANAGER:-true}
      - TASK_MANAGER_MAX_CONCURRENT=${TASK_MANAGER_MAX_CONCURRENT:-8}
      - TASK_MANAGER_MAX_QUEUE_SIZE=${TASK_MANAGER_MAX_QUEUE_SIZE:-1000}
      - SERVICE_HOST=${SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${SERVICE_PORT:-8000}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - OCTOPUS_LOG_LEVEL=INFO

    # 健康检查配置（slim 镜像无 curl，使用 Python 内置检查）
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

    restart: unless-stopped

    volumes:
      - logs:/app/logs

    networks:
      - octopus-network

  # 定时调度服务：基于 cron，编辑 scheduler/crontab 即可管理所有定时任务
  scheduler:
    image: alpine:3.19
    container_name: octopus-scheduler
    restart: unless-stopped
    depends_on:
      octopus-service:
        condition: service_healthy
    volumes:
      - ./scheduler/crontab:/etc/scheduler/crontab:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl > /dev/null 2>&1
        cp /etc/scheduler/crontab /var/spool/cron/crontabs/root
        chmod 600 /var/spool/cron/crontabs/root
        echo "Scheduler started with cron jobs:"
        cat /var/spool/cron/crontabs/root
        crond -f -l 2
    networks:
      - octopus-network

  rsshub:
    # if used default rsshub use image below
    # image: diygod/rsshub:chromium-bundled
    image: rsshub:local_dev
    restart: always
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://redis:6379/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - octopus-network

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    networks:
      - octopus-network

networks:
  octopus-network:
    driver: bridge

volumes:
  logs:
  redis-data:
