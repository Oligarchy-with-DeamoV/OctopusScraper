# ==================== 数据源 ====================
# 通过挂载的 docker.sock 采集容器日志。
# include_labels 是 OR 关系，因此一个 source 可以同时订阅多个 Compose 服务，
# 避免对 docker socket 建立多条独立连接。
[sources.compose_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
include_labels = [
  "com.docker.compose.service=rsshub",
  "com.docker.compose.service=octopus-service",
]

# ==================== 转换1：按服务分流 ====================
# 利用 docker_logs 自动注入的 label 字段把日志拆到两条独立流水线。
# 这里读取的是 Vector 在 docker_logs 事件上挂载的 `.label."com.docker.compose.service"`，
# 与 include_labels 选择条件保持一致。
[transforms.split_by_service]
type = "route"
inputs = ["compose_logs"]
  [transforms.split_by_service.route]
  rsshub = '.label."com.docker.compose.service" == "rsshub"'
  octopus = '.label."com.docker.compose.service" == "octopus-service"'

# ==================== 转换2：过滤需要告警的事件 ====================
# 2.1 rsshub：匹配以 error / fatal 级别开头的日志（兼容 ANSI 颜色与大小写）
# rsshub 在 NODE_ENV=production 下输出的是纯文本 `error: ...`，不带 ANSI；
# 在开发模式下则可能输出 `\x1b[31merror\x1b[39m: ...`。两种形式都需要命中，
# 因此把 ANSI 转义部分整体放进可选组，而不是强制要求。
[transforms.filter_rsshub_errors]
type = "filter"
inputs = ["split_by_service.rsshub"]
condition = "match(string!(.message), r'(?i)^(?:\\x1b\\[[\\d;]*m)*(error|fatal)(?:\\x1b\\[[\\d;]*m)*\\s*:')"

# 2.2 octopus-service：匹配所有 error / critical 级别的结构化日志
# 覆盖 task_manager 的 `Task failed`、config 重载失败、scraper / processor /
# Notion / LLM 等任意模块的 logger.error(...)。仅过滤"级别"而非"事件名"，
# 避免遗漏新增的错误事件。两种 structlog 渲染器都能稳定命中：
# - LOG_FORMAT=plain (ConsoleRenderer): `... [error    ] Task failed   key=value`
#   结构化级别始终以 `[error    ]` / `[critical ]` 形式出现（可能被 ANSI
#   颜色码包裹），允许方括号内出现 ANSI 转义。
# - LOG_FORMAT=json (JSONRenderer):     `{"event":"...","level":"error",...}`
#   通过 `"level":"error"` 字面量匹配。
# Python traceback 的 `File "..."` / `raise ...` 续行不含上述级别标记，
# 因此不会与告警重复（这是 docker_logs 按行切分日志的预期表现）。
[transforms.filter_octopus_errors]
type = "filter"
inputs = ["split_by_service.octopus"]
condition = '''
  match(string!(.message), r'\[[^\]]{0,32}(?i:error|critical)[^\]]{0,32}\]') ||
  match(string!(.message), r'"level"\s*:\s*"(?i:error|critical)"')
'''

# ==================== 转换3：附加告警元数据 ====================
[transforms.format_rsshub_alert]
type = "remap"
inputs = ["filter_rsshub_errors"]
source = '''
  .alert_time = now()
  .hostname = "RSSHub 服务"
  .error_message = string!(.message)
'''

[transforms.format_octopus_alert]
type = "remap"
inputs = ["filter_octopus_errors"]
source = '''
  .alert_time = now()
  .hostname = "Octopus 服务"
  .error_message = string!(.message)
'''

# ==================== 转换4：渲染为飞书卡片 ====================
[transforms.format_feishu]
type = "remap"
inputs = ["format_rsshub_alert", "format_octopus_alert"]
source = '''
  host = string!(.hostname)
  ts = to_string(format_timestamp!(.alert_time, format: "%Y-%m-%d %H:%M:%S", timezone: "Asia/Shanghai"))
  # 清理 ANSI 转义码（颜色控制字符）
  error_msg = replace(string!(.error_message), r'\x1b\[\d+(;\d+)*m', "")

  # 按来源选择卡片标题
  title = if host == "Octopus 服务" {
    "🚨 Octopus 服务错误告警"
  } else {
    "🚨 RSSHub 错误告警"
  }

  card = {
    "msg_type": "interactive",
    "card": {
      "config": {
        "wide_screen_mode": true
      },
      "header": {
        "title": {
          "tag": "plain_text",
          "content": title
        },
        "template": "red"
      },
      "elements": [
        {
          "tag": "div",
          "fields": [
            {
              "is_short": true,
              "text": {
                "tag": "lark_md",
                "content": "**服务名称**\n" + host
              }
            },
            {
              "is_short": true,
              "text": {
                "tag": "lark_md",
                "content": "**告警时间**\n" + ts
              }
            }
          ]
        },
        { "tag": "hr" },
        {
          "tag": "div",
          "text": {
            "tag": "lark_md",
            "content": "**错误详情**\n" + error_msg
          }
        },
        {
          "tag": "note",
          "elements": [
            {
              "tag": "plain_text",
              "content": "由 Vector 自动监控并发送"
            }
          ]
        }
      ]
    }
  }

  .message = encode_json(card)
  del(.alert_time)
  del(.hostname)
  del(.error_message)
'''

# ==================== 输出1：调试 — 原始日志打印到控制台 ====================
[sinks.console]
type = "console"
inputs = ["compose_logs"]
encoding.codec = "json"

# ==================== 输出2：调试 — 过滤后的告警事件打印到控制台 ====================
[sinks.console_alerts]
type = "console"
inputs = ["format_rsshub_alert", "format_octopus_alert"]
encoding.codec = "json"

# ==================== 输出3：发送飞书 Webhook ====================
[sinks.feishu_webhook]
type = "http"
inputs = ["format_feishu"]
uri = "${FEISHU_WEBHOOK_URL}"
method = "post"
encoding.codec = "raw_message"
  [sinks.feishu_webhook.request]
    timeout_secs = 5
    headers = { "Content-Type" = "application/json" }
  [sinks.feishu_webhook.buffer]
    type = "memory"
    max_events = 50

# ==================== 输出4：丢弃 route 未匹配的事件 ====================
# include_labels 已经把容器范围限定为 rsshub 与 octopus-service，
# 但 route transform 仍然会暴露一个 `_unmatched` 出口，
# 用 blackhole 显式消费，避免 Vector 启动时的告警提示。
[sinks.drop_unmatched]
type = "blackhole"
inputs = ["split_by_service._unmatched"]
