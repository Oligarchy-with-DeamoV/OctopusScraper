# ==================== 数据源 ====================
# 通过挂载的 docker.sock 采集容器日志。
# 注意：Vector v0.54 的 docker_logs source 在 `include_labels` 出现"同一 key、
# 多个 value"时会把多条 entry 当成 AND 合并，导致一个容器都匹配不上。因此
# 必须按服务拆成独立 source，每个 source 只用一条 `include_labels`。
# 多开一个 docker.sock 连接的开销可忽略。
[sources.rsshub_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
include_labels = ["com.docker.compose.service=rsshub"]

[sources.octopus_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
include_labels = ["com.docker.compose.service=octopus-service"]

# ==================== 转换1：过滤需要告警的事件 ====================
# 1.1 rsshub：匹配以 error / fatal 级别开头的日志（兼容 ANSI 颜色与大小写）
# rsshub 在 NODE_ENV=production 下输出的是纯文本 `error: ...`，不带 ANSI；
# 在开发模式下则可能输出 `\x1b[31merror\x1b[39m: ...`。两种形式都需要命中，
# 因此把 ANSI 转义部分整体放进可选组，而不是强制要求。
[transforms.filter_rsshub_errors]
type = "filter"
inputs = ["rsshub_logs"]
condition = "match(string!(.message), r'(?i)^(?:\\x1b\\[[\\d;]*m)*(error|fatal)(?:\\x1b\\[[\\d;]*m)*\\s*:')"

# 1.2 octopus-service：匹配所有 error / critical 级别的结构化日志
# 覆盖 task_manager 的 `Task failed`、config 重载失败、scraper / processor /
# Notion / LLM 等任意模块的 logger.error(...)。仅过滤"级别"而非"事件名"，
# 避免遗漏新增的错误事件。前提：structlog 配置里加了 `add_log_level` processor
# （详见 src/octopus_scraper/service/config_helpers.py 与 cli/__init__.py），
# 否则两种渲染器都不会把 level 写进输出，本 filter 永远不会命中。
# - LOG_FORMAT=plain (ConsoleRenderer): `... [error    ] Task failed   key=value`
#   级别以 `[error    ]` / `[critical ]` 形式出现（可能被 ANSI 颜色码包裹）。
# - LOG_FORMAT=json (JSONRenderer):     `{"event":"...","level":"error",...}`
#   通过 `"level":"error"` 字面量匹配。
# Python traceback 的 `File "..."` / `raise ...` 续行不含上述级别标记，
# 因此不会与告警重复（这是 docker_logs 按行切分日志的预期表现）。
[transforms.filter_octopus_errors]
type = "filter"
inputs = ["octopus_logs"]
condition = '''
  match(string!(.message), r'\[[^\]]{0,32}(?i:error|critical)[^\]]{0,32}\]') ||
  match(string!(.message), r'"level"\s*:\s*"(?i:error|critical)"')
'''

# 1.3 octopus-service：配置加载的临时网络错误降噪
# ConfigManager 每次刷新配置时，NotionConfigClient 先记录
# `Failed to load scrapers configuration`，外层随后可能再记录
# `Failed to reload configuration`。只用前者参与计数，避免一次网络抖动
# 被重复算作两次；后者若属于同类网络错误则不即时告警。
[transforms.filter_octopus_config_load_network_errors]
type = "filter"
inputs = ["filter_octopus_errors"]
condition = '''
  match(string!(.message), r'Failed to load scrapers configuration') &&
  match(string!(.message), r'(?i)(timeout|timed out|readtimeout|connecttimeout|connect|connection|network|temporary|remoteprotocolerror|rate[_ -]?limit|too_many_requests|429|500|502|503|504|badgateway|serviceunavailable|gatewaytimeout)')
'''

[transforms.filter_octopus_immediate_errors]
type = "filter"
inputs = ["filter_octopus_errors"]
condition = "!(match(string!(.message), r'(Failed to load scrapers configuration|Failed to reload configuration)') && match(string!(.message), r'(?i)(timeout|timed out|readtimeout|connecttimeout|connect|connection|network|temporary|remoteprotocolerror|rate[_ -]?limit|too_many_requests|429|500|502|503|504|badgateway|serviceunavailable|gatewaytimeout)'))"

# ==================== 转换3：附加告警元数据 ====================
[transforms.format_rsshub_alert]
type = "remap"
inputs = ["filter_rsshub_errors"]
source = '''
  .alert_time = now()
  .hostname = "RSSHub 服务"
  .error_message = string!(.message)
'''

[transforms.format_octopus_alert]
type = "remap"
inputs = ["filter_octopus_immediate_errors"]
source = '''
  .alert_time = now()
  .hostname = "Octopus 服务"
  .error_message = string!(.message)
'''

[transforms.mark_octopus_config_load_network_errors]
type = "remap"
inputs = ["filter_octopus_config_load_network_errors"]
source = '''
  .config_noise_key = "octopus_config_load_network_error"
  .config_noise_count = 1
  .error_message = string!(.message)
'''

# 30 分钟窗口内至少 3 次才发送。默认每 5 分钟刷新一次配置，因此持续
# 网络异常会触发告警，单次或短暂抖动则不会即时推送。
[transforms.aggregate_octopus_config_load_network_errors]
type = "reduce"
inputs = ["mark_octopus_config_load_network_errors"]
group_by = ["config_noise_key"]
end_every_period_ms = 1800000
expire_after_ms = 1860000
  [transforms.aggregate_octopus_config_load_network_errors.merge_strategies]
    config_noise_count = "sum"
    error_message = "retain"

[transforms.filter_octopus_config_load_network_alerts]
type = "filter"
inputs = ["aggregate_octopus_config_load_network_errors"]
condition = "int!(.config_noise_count) >= 3"

[transforms.format_octopus_config_load_network_alert]
type = "remap"
inputs = ["filter_octopus_config_load_network_alerts"]
source = '''
  .alert_time = now()
  .hostname = "Octopus 服务"
  count = int!(.config_noise_count)
  sample = string!(.error_message)
  .error_message = "配置加载网络异常在过去 30 分钟内发生 " + to_string(count) + " 次；持续异常会在后续窗口继续推送。示例：" + sample
  del(.config_noise_key)
  del(.config_noise_count)
'''

# ==================== 转换4：渲染为飞书卡片 ====================
[transforms.format_feishu]
type = "remap"
inputs = [
  "format_rsshub_alert",
  "format_octopus_alert",
  "format_octopus_config_load_network_alert",
]
source = '''
  host = string!(.hostname)
  ts = to_string(format_timestamp!(.alert_time, format: "%Y-%m-%d %H:%M:%S", timezone: "Asia/Shanghai"))
  # 清理 ANSI 转义码（颜色控制字符）
  error_msg = replace(string!(.error_message), r'\x1b\[\d+(;\d+)*m', "")

  # 按来源选择卡片标题
  title = if host == "Octopus 服务" {
    "🚨 Octopus 服务错误告警"
  } else {
    "🚨 RSSHub 错误告警"
  }

  card = {
    "msg_type": "interactive",
    "card": {
      "config": {
        "wide_screen_mode": true
      },
      "header": {
        "title": {
          "tag": "plain_text",
          "content": title
        },
        "template": "red"
      },
      "elements": [
        {
          "tag": "div",
          "fields": [
            {
              "is_short": true,
              "text": {
                "tag": "lark_md",
                "content": "**服务名称**\n" + host
              }
            },
            {
              "is_short": true,
              "text": {
                "tag": "lark_md",
                "content": "**告警时间**\n" + ts
              }
            }
          ]
        },
        { "tag": "hr" },
        {
          "tag": "div",
          "text": {
            "tag": "lark_md",
            "content": "**错误详情**\n" + error_msg
          }
        },
        {
          "tag": "note",
          "elements": [
            {
              "tag": "plain_text",
              "content": "由 Vector 自动监控并发送"
            }
          ]
        }
      ]
    }
  }

  .message = encode_json(card)
  del(.alert_time)
  del(.hostname)
  del(.error_message)
'''

# ==================== 输出1：调试 — 原始日志打印到控制台 ====================
[sinks.console]
type = "console"
inputs = ["rsshub_logs", "octopus_logs"]
encoding.codec = "json"

# ==================== 输出2：调试 — 过滤后的告警事件打印到控制台 ====================
[sinks.console_alerts]
type = "console"
inputs = [
  "format_rsshub_alert",
  "format_octopus_alert",
  "format_octopus_config_load_network_alert",
]
encoding.codec = "json"

# ==================== 输出3：发送飞书 Webhook ====================
[sinks.feishu_webhook]
type = "http"
inputs = ["format_feishu"]
uri = "${FEISHU_WEBHOOK_URL}"
method = "post"
encoding.codec = "raw_message"
  [sinks.feishu_webhook.request]
    timeout_secs = 5
    headers = { "Content-Type" = "application/json" }
  [sinks.feishu_webhook.buffer]
    type = "memory"
    max_events = 50
