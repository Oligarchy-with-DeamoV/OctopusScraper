name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: octopus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d octopus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Validate changelog fragments
        run: go run ./tools/changelog check

      - name: Test PostgreSQL migrations
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/octopus_test?sslmode=disable
        run: go test ./internal/storage -run Integration -count=1

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce coverage
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN {
            if (coverage + 0 < 95) {
              printf "coverage %.1f%% is below 95%%\n", coverage
              exit 1
            }
          }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan dependencies and code
        run: govulncheck ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build metadata
        id: build
        shell: bash
        run: |
          description="$(git describe --tags --always --dirty)"
          if [[ "$description" == v* ]]; then
            version="${description#v}"
          else
            version="dev-${description}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build service image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.build.outputs.version }}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${{ steps.build.outputs.date }}" \
            -f dockerfiles/Dockerfile \
            -t octopus-scraper:ci \
            .

      - name: Enforce image size
        run: |
          size="$(docker image inspect octopus-scraper:ci --format '{{.Size}}')"
          limit="$((70 * 1024 * 1024))"
          echo "image size: $size bytes"
          test "$size" -le "$limit"
