# OctopusScraper 配置文件
# 复制此文件为 config.yml 并修改相应配置

# =============================================================================
# 抓取器配置 (使用最新任务管理系统)
# =============================================================================
scrapers_config_with_fetch_params:
  # VS Code GitHub Issues 抓取
  - scraper_config:
      fetcher_name: "rsshub"
      fetcher_config:
        hub_root: "https://rsshub.app"
        route: "/github/issues/microsoft/vscode"
      content_processor_configs: {}
    fetch_params:
      limit: 20

  # 少数派热门文章
  - scraper_config:
      fetcher_name: "rsshub"
      fetcher_config:
        hub_root: "https://rsshub.app"
        route: "/sspai/matrix"
      content_processor_configs: {}
    fetch_params:
      limit: 10

  # 技术博客 RSS 示例
  - scraper_config:
      fetcher_name: "direct_rss"
      fetcher_config:
        hub_root: "https://ruanyifeng.com"
        route: "/blog/atom.xml"
      content_processor_configs: {}
    fetch_params:
      limit: 15
      filter_hours: 24

  # HackerNews 热门
  - scraper_config:
      fetcher_name: "rsshub"
      fetcher_config:
        hub_root: "https://rsshub.app"
        route: "/hackernews/best"
      content_processor_configs: {}
    fetch_params:
      limit: 10

# =============================================================================
# Notion API 配置
# =============================================================================
notion_api_config:
  api_key: "${NOTION_API_KEY}"  # 请设置环境变量或直接填写
  database_id: "${NOTION_CONTENT_DATABASE_ID}"  # Notion 数据库 ID

# =============================================================================
# 任务管理系统配置
# =============================================================================
use_task_manager: true  # 启用任务管理系统

task_manager_config:
  max_concurrent_tasks: 8        # 最大并发任务数
  max_queue_size: 1000          # 任务队列最大大小
  result_retention_hours: 48     # 任务结果保留时间（小时）

# =============================================================================
# 服务配置 (Web API 服务)
# =============================================================================
service:
  host: "0.0.0.0"
  port: 8000
  debug: false
  log_level: "INFO"
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  config_refresh_interval: 300  # 配置刷新间隔（秒）
  scraper_timeout: 300          # 抓取超时时间（秒）
  upload_timeout: 60            # 上传超时时间（秒）
  upload_max_retries: 3         # 上传最大重试次数

# =============================================================================
# 任务调度器配置 (可选 - 自动定时任务)
# =============================================================================
scheduler_config:
  enabled: false  # 设为 true 启用自动调度
  schedules:
    # 每日定时抓取示例
    - schedule_id: "daily_vscode_issues"
      scraper_name: "vscode_issues"
      cron_expression: "0 8 * * *"  # 每天上午8点
      enabled: false
      max_concurrent_runs: 1
      timeout_seconds: 600
      fetch_params:
        limit: 50
      metadata:
        source: "github"
        category: "issues"

    # 每2小时抓取少数派
    - schedule_id: "bi_hourly_sspai"
      scraper_name: "sspai_matrix"
      cron_expression: "0 */2 * * *"  # 每2小时
      enabled: false
      max_concurrent_runs: 1
      timeout_seconds: 300
      fetch_params:
        limit: 10
      metadata:
        source: "sspai"
        category: "matrix"

# =============================================================================
# 快速开始指南
# =============================================================================
# 1. 设置环境变量:
#    export NOTION_API_KEY="your_notion_api_key"
#    export NOTION_CONTENT_DATABASE_ID="your_database_id"
#
# 2. 或者直接在上面的 notion_api_config 中填写实际值
#
# 3. 启动服务:
#    poetry run octopus_service
#
# 4. 访问管理界面:
#    http://localhost:8000/admin
#
# 5. 手动触发抓取:
#    curl -X POST http://localhost:8000/trigger/scraper
#
# 6. 查看健康状态:
#    curl http://localhost:8000/health
