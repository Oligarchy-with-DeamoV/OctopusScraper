# OctopusScraper 配置文件示例
# 复制此文件为 config.yml 并修改相应配置

# =============================================================================
# 抓取器配置 (传统格式，向后兼容)
# =============================================================================
scrapers:
  # RSS 抓取器示例
  - name: "技术博客示例"
    fetcher: "direct_rss"
    hub_root: "https://example.com"
    route: "/feed.xml"
    priority: 1
    fetch_params:
      limit: 10
      filter_hours: 24 # 仅获取24小时内的内容

  # RSSHub 抓取器示例
  - name: "少数派热门"
    fetcher: "rsshub"
    hub_root: "https://rsshub.app"
    route: "/sspai/matrix"
    priority: 2
    fetch_params:
      limit: 5

# =============================================================================
# 新任务管理系统配置 (推荐使用)
# =============================================================================
# 使用新的任务管理系统配置格式
scrapers_config_with_fetch_params:
  - scraper_config:
      fetcher_name: "rsshub"
      fetcher_config:
        hub_root: "https://rsshub.app"
        route: "/github/issues/microsoft/vscode"
      content_processor_configs: {}
    fetch_params:
      limit: 20

  - scraper_config:
      fetcher_name: "rsshub"
      fetcher_config:
        hub_root: "https://rsshub.app"
        route: "/sspai/matrix"
      content_processor_configs: {}
    fetch_params:
      limit: 10

  - scraper_config:
      fetcher_name: "direct_rss"
      fetcher_config:
        hub_root: "https://example.com"
        route: "/feed.xml"
      content_processor_configs: {}
    fetch_params:
      limit: 15
      filter_hours: 24

# =============================================================================
# Notion 配置
# =============================================================================
# 传统格式（向后兼容）
notion:
  api_key: "${NOTION_API_KEY}" # 从环境变量获取
  content_database_id: "${NOTION_CONTENT_DATABASE_ID}"

# 新格式（推荐使用）
notion_api_config:
  api_key: "${NOTION_API_KEY}"
  database_id: "${NOTION_CONTENT_DATABASE_ID}"

# =============================================================================
# 并发配置
# =============================================================================
# 传统设置
max_concurrent_scrapers: 5 # 最大并发抓取器数量，默认为5

# 新任务管理系统设置
use_task_manager: true  # 启用新的任务管理系统

task_manager_config:
  max_concurrent_tasks: 8        # 最大并发任务数（会覆盖 max_concurrent_scrapers）
  max_queue_size: 1000          # 任务队列最大大小
  result_retention_hours: 48     # 任务结果在内存中保留时间（小时）

# =============================================================================
# 任务调度器配置 (可选)
# =============================================================================
# 如果要使用自动调度功能，请取消注释以下配置
