#       metadata:
#         source: "sspai"
#         category: "matrix"

# =============================================================================
# 服务配置 (可选，仅在 Web 服务模式下使用)
# =============================================================================
service:
  host: "0.0.0.0"
  port: 8000
  debug: false
  log_level: "INFO"
  config_refresh_interval: 300 # 配置刷新间隔（秒）
  scraper_timeout: 10 # 抓取超时时间（秒）
  upload_timeout: 15 # 上传超时时间（秒）
  upload_max_retries: 3 # 上传最大重试次数

# =============================================================================
# 使用说明
# =============================================================================
# 1. 如果你想使用传统模式，请配置 scrapers 和 notion 部分
# 2. 如果你想使用新的任务管理系统，请：
#    - 设置 use_task_manager: true
#    - 配置 scrapers_config_with_fetch_params 和 notion_api_config
#    - 配置 task_manager_config 部分
# 3. 如果需要自动调度，请启用 scheduler_config
# 4. 服务配置仅在以 Web 服务模式运行时需要
