[project]
name = "octopus-scraper"
version = "0.1.0"
description = "OctopusScraper 是一款多功能信息抓取工具，旨在通过高效的算法分析和处理各种媒体数据。"
authors = [
    {name = "Duan-JM",email = "vincent.duan95@gmail.com"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">3.9, <3.11"
feedparser = "^6.0.11"
tenacity = "^9.0.0"
notion_client = "^2.3.0"
jsonschema = "^4.23.0"
httpx = {version = "^0.27.0", extras = ["socks"]}
html2markdown = "^0.1.7"
doraemon = { file = "./resources/whls/doraemon-0.0.5b0-py3-none-any.whl" }
pyyaml = "^6.0.1"
sanic = ">=21.3.0"
python-dotenv = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.23.5"
pytest-xdist = "^3.2.1"
pytest-mock = ">0"
pytest = "^7.1.3"
black = "^22.10.0"
tqdm = "^4.66.4"
ipdb = "^0.13.13"

[[tool.poetry.source]]
name = "aliyun for china users"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[tool.poetry.scripts]
octopus_go = "octopus_scraper.cli:run_octopus_go"

[tool.pytest.ini_options]
pythonpath = "src"
log_cli = true
log_cli_level = "DEBUG"
markers = [
    "need_external_service: marks tests as need external service",
    "integrate_test: test all rss resources",
]
addopts = [
    "--import-mode=importlib",
    "--showlocals",
    "--verbose",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "./src/octopus_scraper/service_models.py",
    "./src/octopus_scraper/octopus_service.py",
    "./src/octopus_scraper/tests/*"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
