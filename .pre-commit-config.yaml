exclude: ./resources
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files

-   repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
    -   id: black
        name: Format with black

-   repo: local
    hooks:
    - id: pytest
      name: Check for all tests
      entry: poetry run pytest -m "not integrate_test" --cov=octopus_scraper --cov-fail-under=80 ./tests/
      language: system
      types: [python]
