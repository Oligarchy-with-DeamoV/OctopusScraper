exclude: ./resources
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: Format with black

  - repo: local
    hooks:
      - id: pytest
        name: Check for all tests
        entry: poetry run pytest -m "not need_external_service and not integrate_test" ./tests/ -n auto
        language: system
        types: [python]
