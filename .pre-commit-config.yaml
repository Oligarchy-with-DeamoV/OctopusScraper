exclude: ^(resources/|contracts/yaml/duplicate-key\.yaml$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofmt
        name: Check Go formatting
        entry: bash -c 'test -z "$(gofmt -l .)"'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: Run Go tests
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
